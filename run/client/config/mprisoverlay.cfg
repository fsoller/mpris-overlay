# Configuration file

general {
    # Progress bar color, #RRGGBB or #AARRGGBB [default: #00FF00]
    S:accentColor=#00FF00

    # Players whose name starts with one of these are ignored. Names are the ones printed by 'playerctl -l' [default: [firefox]]
    S:blacklist <
        firefox
     >

    # Hide the HUD completely when nothing is playing [default: false]
    B:hideWhenIdle=false

    # HUD size [range: 0.25 ~ 4.0, default: 1.0]
    S:hudScale=1.0

    # Position of the top-left corner (GUI pixels) [range: -10000 ~ 10000, default: 10]
    I:hudX=10

    # Position of the top-left corner (GUI pixels) [range: -10000 ~ 10000, default: 10]
    I:hudY=10

    # Show or hide the HUD [default: true]
    B:renderOverlay=true

    # Keep showing the track while the player is paused [default: true]
    B:showPaused=true
}


